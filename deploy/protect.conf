# /etc/apache2/conf-available/mutazsatti-protect.conf
#
# حماية عامة — تسري على كل المواقع على الخادم، لا على موقعنا وحده.
#
# السبب: المشروع يقع تحت /var/www/html وهو الجذر الافتراضي للموقع
# المبدئي (000-default). بدون هذا الملف يصبح كل محتوى المشروع قابلاً
# للتحميل عبر أي VirtualHost يخدم ذلك الجذر — بما فيه ملف .env
# وقاعدة البيانات.
#
# قيود <Directory> داخل <VirtualHost> تسري على ذلك الموقع وحده،
# لذلك توضع هذه القيود خارج أي VirtualHost لتكون عامة.
#
# التفعيل:
#   sudo cp deploy/protect.conf /etc/apache2/conf-available/mutazsatti-protect.conf
#   sudo a2enconf mutazsatti-protect
#   sudo systemctl reload apache2

# امنع كل شيء تحت جذر المشروع افتراضياً
<Directory /var/www/html/mutazsatti.com>
    AllowOverride None
    Require all denied
</Directory>

# لا يُسمح بالوصول إلى public إلا عبر VirtualHost موقعنا،
# الذي يعيد فتحه بـ Require all granted على مساره الخاص.
