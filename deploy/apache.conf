# /etc/apache2/sites-available/mutazsatti.com.conf
# موقع معتز ساتي — Laravel 13 + PHP 8.3-FPM عبر mod_proxy_fcgi
#
# الوحدات المطلوبة قبل التفعيل:
#   sudo a2enmod rewrite proxy_fcgi setenvif deflate expires headers

# تحويل www إلى النطاق الأساسي
<VirtualHost *:80>
    ServerName www.mutazsatti.com
    Redirect permanent / http://mutazsatti.com/
</VirtualHost>

<VirtualHost *:80>
    ServerName mutazsatti.com
    ServerAdmin admin@mutazsatti.com

    DocumentRoot /var/www/html/mutazsatti.com/public

    # ── جذر الموقع ──
    # AllowOverride All مطلوب ليعمل ملف public/.htaccess الذي يوجّه
    # كل الطلبات إلى index.php (نظام مسارات Laravel).
    <Directory /var/www/html/mutazsatti.com/public>
        Options -Indexes -MultiViews +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # منع الوصول لأي شيء خارج public
    <Directory /var/www/html/mutazsatti.com>
        Options -Indexes
        AllowOverride None
        Require all denied
    </Directory>

    # ── تمرير PHP إلى FPM ──
    <FilesMatch \.php$>
        SetHandler "proxy:unix:/run/php/php8.3-fpm.sock|fcgi://localhost"
    </FilesMatch>

    # ── ترويسات أمان ──
    <IfModule mod_headers.c>
        Header always set X-Frame-Options "SAMEORIGIN"
        Header always set X-Content-Type-Options "nosniff"
        Header always set Referrer-Policy "strict-origin-when-cross-origin"
        Header always unset X-Powered-By
        Header unset X-Powered-By
    </IfModule>

    # ── ضغط ──
    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE text/html text/plain text/css text/xml \
            application/javascript application/json application/xml \
            application/rss+xml image/svg+xml
    </IfModule>

    # ── تخزين مؤقت ──
    <IfModule mod_expires.c>
        ExpiresActive On
        # أصول Vite تحمل بصمة في الاسم، فالتخزين الطويل آمن
        <LocationMatch "^/build/">
            ExpiresDefault "access plus 1 year"
            Header set Cache-Control "public, immutable"
        </LocationMatch>
        ExpiresByType image/jpeg    "access plus 30 days"
        ExpiresByType image/png     "access plus 30 days"
        ExpiresByType image/webp    "access plus 30 days"
        ExpiresByType image/avif    "access plus 30 days"
        ExpiresByType image/svg+xml "access plus 30 days"
        ExpiresByType font/woff2    "access plus 1 year"
    </IfModule>

    # ── منع الوصول للملفات الحساسة ──
    <FilesMatch "\.(env|sqlite|sqlite3|db)$">
        Require all denied
    </FilesMatch>
    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>

    # حجم الرفع يُضبط في php.ini — راجع المرحلة 1

    ErrorLog  ${APACHE_LOG_DIR}/mutazsatti.error.log
    CustomLog ${APACHE_LOG_DIR}/mutazsatti.access.log combined
</VirtualHost>
